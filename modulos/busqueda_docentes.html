<form id="frmBusquedaDocentes">
    <div class="card text-bg-dark">
        <div class="card-header">BUSQUEDA DE DOCENTES</div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>CODIGO</th>
                        <th>NOMBRE</th>
                        <th>DIRECCION</th>
                        <th>TELEFONO</th>
                        <th>EMAIL</th>
                        <th>DUI</th>
                        <th>ESCALAFON</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tblDocentes"></tbody>
            </table>
        </div>
    </div>
</form>

<script>
    // NO duplicar variables, usar las mismas que en docentes.js
    // idDocente y accion ya están declaradas allá

    document.addEventListener("DOMContentLoaded", ()=>{
        obtenerDocentes();
    });

    async function obtenerDocentes(){
        let response = await fetch("/docentes"), 
            respuesta = await response.json();
        mostrarDatosDocentes(respuesta);
    }

    function mostrarDatosDocentes(docentes){
        let filas = "";
        docentes.forEach(docente=>{
            filas += `
                <tr onClick='mostrarDocente(${ JSON.stringify(docente) })'>
                    <td>${docente.codigo}</td>
                    <td>${docente.nombre}</td>
                    <td>${docente.direccion}</td>
                    <td>${docente.telefono}</td>
                    <td>${docente.email}</td>
                    <td>${docente.dui}</td>
                    <td>${docente.escalafon}</td>
                    <td>
                        <button onClick='eliminarDocente(${ JSON.stringify(docente) }, event)' 
                                class="btn btn-danger btn-sm">ELIMINAR</button>
                    </td>
                </tr>
            `;
        });
        tblDocentes.innerHTML = filas;
    }

    function eliminarDocente(docente, event){
        event.preventDefault();
        event.stopPropagation();
        if(confirm(`¿Está seguro de eliminar a ${docente.nombre}?`)){
            idDocente = docente.idDocente;
            accion = "eliminar"; // usar misma variable global
            guardarDocentes().then(() => {
                obtenerDocentes(); // Recargar la tabla después de eliminar
            });
        }
    }
</script>

<!-- Cargar módulo principal de docentes -->
<script src="modulos/docentes.js"></script>
