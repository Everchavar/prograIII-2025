<form id="frmBusquedaMaterias">
    <div class="card text-bg-dark">
        <div class="card-header">
            <div class="d-flex">
                BUSQUEDA DE MATERIAS
                <div class="ms-auto">
                    <button data-form="busqueda_materias" type="button" class="btn-close btn-close-white" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <table class="table table-hover table-dark table-striped text-white">
                <thead>
                    <tr>
                        <th>UV</th>
                        <th>NOMBRE</th>
                        <th>DOCENTE</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tblMaterias"></tbody>
            </table>
        </div>
    </div>
</form>
<script>
    // Verificar que no se ejecute múltiples veces
    if(typeof obtenerMateriasEjecutado === 'undefined'){
        obtenerMateriasEjecutado = true;
        obtenerMaterias();
    }
    
    async function obtenerMaterias(){
        try {
            let response = await fetch("/materias"), 
                respuesta = await response.json();
            mostrarDatosMaterias(respuesta);
        } catch(error) {
            console.error('Error al obtener materias:', error);
            alertify.error('Error al cargar materias');
        }
    }
    
    function mostrarDatosMaterias(materias){
        // Limpiar tabla antes de agregar
        tblMaterias.innerHTML = "";
        
        let filas = "";
        materias.forEach(materia=>{
            filas += `
                <tr onClick='mostrarMateria(${JSON.stringify(materia)})'>
                    <td>${materia.uv || ''}</td>
                    <td>${materia.nombre || ''}</td>
                    <td>${materia.docente || ''}</td>
                    <td><button onClick='eliminarMateria(${JSON.stringify(materia)}, event)' class="btn btn-outline-danger btn-sm">ELIMINAR</button></td>
                </tr>
            `;
        });
        tblMaterias.innerHTML = filas;
    }
    
    function eliminarMateria(materia, event){
        event.preventDefault();
        event.stopPropagation();
        
        if(confirm(`Esta seguro de eliminar a ${materia.nombre}?`)){
            idMateria = materia.idMateria;
            accion = "eliminar";
            guardarMaterias();
        }
    }
</script>
